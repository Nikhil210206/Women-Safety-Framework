# supabase/config.toml
# Supabase CLI local development config.
# Docs: https://supabase.com/docs/guides/local-development/cli/config

project_id = "fsxobkynhyxkmunpzgel"

[api]
enabled     = true
port        = 54321
schemas     = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows    = 1000

[api.tls]
enabled = false

[db]
port         = 54322
shadow_port  = 54320
major_version = 15

[db.pooler]
enabled          = false
port             = 54329
pool_mode        = "transaction"
default_pool_size = 20
max_client_conn  = 100

[realtime]
enabled           = true
max_header_length = 4096

[studio]
enabled     = true
port        = 54323
api_url     = "http://127.0.0.1"
openapi_url = "http://127.0.0.1:54321"

[local_smtp]
enabled   = true
port      = 54324
smtp_port = 54325
pop3_port = 54326

# Nothing in this repo uses storage buckets yet; off to keep the local stack light.
[storage]
enabled         = false
file_size_limit = "50MiB"

[storage.image_transformation]
enabled = false

[auth]
enabled                       = true
site_url                      = "http://127.0.0.1:3000"
additional_redirect_urls      = ["https://127.0.0.1:3000"]
jwt_expiry                    = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval  = 10
enable_signup                 = true
enable_anonymous_sign_ins     = false
enable_manual_linking         = false
minimum_password_length       = 6
password_requirements         = ""

[auth.email]
enable_signup           = true
double_confirm_changes  = true
enable_confirmations    = false
secure_password_change  = false

[auth.sms]
enable_signup        = true
enable_confirmations = false
template             = "Your code is {{ .Code }}"
max_frequency        = "5s"

# Local phone login without sending an SMS. The numbers below always accept
# the code beside them (write them without the +; in the app, type the last
# ten digits). Add your own number here to sign in as yourself.
# Any other number fails: the Twilio block is a placeholder that only exists
# because the CLI turns phone login off when no provider is enabled.
[auth.sms.test_otp]
919000000001 = "123456"
919000000002 = "123456"
919000000003 = "123456"
917305644420 = "123456"
919940903891 = "123456"

[auth.sms.twilio]
enabled             = true
account_sid         = "local-placeholder"
message_service_sid = "local-placeholder"
auth_token          = "local-placeholder"

[auth.external.google]
enabled          = false
client_id        = "env(GOOGLE_CLIENT_ID)"
secret           = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

# No supabase/functions yet; turn on when the first edge function is added.
[edge_runtime]
enabled       = false
policy        = "oneshot"
inspector_port = 8083

[analytics]
enabled = false
port    = 54327
backend = "postgres"
